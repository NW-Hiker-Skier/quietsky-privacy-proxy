# Example deploy config for the Quiet Sky privacy proxy (public).
#
# This file documents the bindings and variable NAMES the Worker expects.
# Production values (account-specific KV namespace ids, Worker name, upstream
# hosts) are deliberately not published; a functional deployment also requires
# your own provider adapters (see src/adapters/index.ts — the public tree ships
# a stub registry).

name = "my-privacy-proxy"
main = "src/index.ts"
compatibility_date = "2026-04-26"
workers_dev = true

# Durable, cross-PoP caches + single-flight locks. Create your own namespaces:
#   npx wrangler kv namespace create <NAME>
[[kv_namespaces]]
binding = "SUNSETHUE_CACHE"
id = "<your-kv-namespace-id>"

[[kv_namespaces]]
binding = "AQI_CACHE"
id = "<your-kv-namespace-id>"

[[kv_namespaces]]
binding = "RAINBOW_CACHE"
id = "<your-kv-namespace-id>"

[[kv_namespaces]]
binding = "FORECA_CACHE"
id = "<your-kv-namespace-id>"

# Abuse-backstop rate limiting, per client IP + route class. The Worker fails
# open when these are absent, so this block is safely removable. The limits and
# namespace ids below are EXAMPLES — choose your own from observed traffic.
[[unsafe.bindings]]
name = "RL_GATED"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 300, period = 60 }

[[unsafe.bindings]]
name = "RL_TILE"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 1000, period = 60 }

[vars]
# Upstream hosts consumed by adapter bindings (values here are placeholders).
OPEN_METEO_UPSTREAM = "https://your-forecast-upstream.example"
OPEN_METEO_AIR_QUALITY_UPSTREAM = "https://your-air-quality-upstream.example"
OPEN_METEO_GEOCODING_UPSTREAM = "https://your-geocoding-upstream.example"
FORECA_UPSTREAM = "https://your-premium-forecast-upstream.example"
PIRATE_UPSTREAM = "https://your-secondary-forecast-upstream.example"
IQAIR_UPSTREAM = "https://your-aqi-upstream.example"
SUNSETHUE_UPSTREAM = "https://your-sunset-upstream.example"
# Optional radar/nowcast upstream hosts — the withheld adapters fall back to their
# own public defaults when these are unset:
# RAINVIEWER_UPSTREAM = "https://your-radar-upstream.example"
# IEM_UPSTREAM = "https://your-radar-fallback-upstream.example"
# RAINBOW_UPSTREAM = "https://your-nowcast-upstream.example"
# Test-build kill switch (see /v1/build-status): comma-separated versionCodes.
BUILD_STATUS_KILLED_VERSION_CODES = ""
BUILD_STATUS_KILL_MESSAGE = ""

# Secrets (never in this file — set via `npx wrangler secret put <NAME>`):
#   OPEN_METEO_API_KEY, FORECA_API_KEY, PIRATE_API_KEY, IQAIR_API_KEY,
#   SUNSETHUE_API_KEY, RAINBOW_API_KEY,
#   QUIETSKY_CLIENT_TOKEN (optional client gate),
#   QUIETSKY_DEBUG_TOKEN (optional debug gate for fresh=1)
